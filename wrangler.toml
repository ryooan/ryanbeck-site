name = "ryanbeck-site"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# Static files are served straight from the edge and cost nothing —
# they never touch the Worker unless no file matches the path.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/index.html", "/march-madness", "/march-madness/*", "/mtg-cheat-sheet", "/mtg-cheat-sheet/*"]
not_found_handling = "404-page"
# "none", because _redirects owns the pretty URLs. The default
# (auto-trailing-slash) 307s /about.html back to /about, which combines with
# our "/about -> /about.html 200" rewrite into an infinite redirect loop.
html_handling = "none"

[observability]
enabled = true

# Uncomment once the domain is pointed at Cloudflare:
# [[routes]]
# pattern = "ryanrobertbeck.com"   # site-url
# custom_domain = true

# The gateway also makes all apps available under one localhost origin.
[[services]]
binding = "MTG"
service = "mtg-mechanics-cheatsheet"
[[services]]
binding = "MARCH_MADNESS"
service = "ryanbeck-march-madness"
