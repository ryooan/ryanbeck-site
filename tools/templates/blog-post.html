<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · Ryan Beck</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}} · Ryan Beck">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/assets/og.jpg">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
{{header}}
<main>
  <article class="blog-article wrap">
    <header class="page-head">
      <p><a href="/blog">← All writing</a></p>
      <h1>{{title}}</h1>
      <time datetime="{{iso}}">{{date}}</time>
    </header>
    <div class="article-body">{{content}}</div>
    <nav class="article-neighbors" aria-label="Other posts">{{neighbors}}</nav>
    <p class="article-original"><a href="{{original}}">View this post on the original site</a></p>
  </article>
</main>
{{footer}}
</body>
</html>
