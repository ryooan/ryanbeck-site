name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Load reviewed domain configuration
        env:
          SITE_DEPLOYMENT_CONFIG: ${{ vars.SITE_DEPLOYMENT_CONFIG }}
        run: node tools/ci-deploy-config.mjs
      - run: npm run site-url
      - run: npm test

      # Deploy is intentionally manual until domain/resource configuration is complete.
      - run: node tools/check-deploy.mjs

      # Fails the build if a page links to a file that isn't there.
      - name: Check internal links
        run: node tools/check-links.mjs

      - name: Check the docs still match the code
        run: node tools/check-docs.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .deploy/wrangler.json
