name: Deploy

# Deploys the ryanbeck-site Worker (pages, /api/*, the two app bindings).
# Runs on every push to master, by hand, and from forecasting.yml after a
# data commit: a push made with GITHUB_TOKEN does not trigger other
# workflows, so that one calls this file directly.
#
# Needs two Actions secrets for the personal Cloudflare account:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (kept out of this public repo).
# The domain comes from the committed site.config.json, by way of
# tools/site-deploy-config.py.

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch or commit to deploy'
        type: string
        required: false
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # A called run would otherwise check out the commit that started
          # the caller -- the one *before* the data commit it just pushed.
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # Regenerates .deploy/wrangler.json from wrangler.toml, then runs
      # npm test (links, docs, site URL, public data) and check-deploy.
      - run: npm run predeploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .deploy/wrangler.json
